# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp: headless discovery runs.
#
# State so far: the template (YoshiNESRecomp) builds against this ROM, and the
# binary's built-in headless mode ran 600 frames. 99.8% of the CPU work went
# through the interpreter fallback (no code seeds yet), so the game executes but
# is not yet statically recompiled.
#
# This run (flag syntax for --miss-log / --spam / --screenshot is GUESSED):
#   C) 3600 frames with the miss log on, to see what code the game touches
#   D) the same with random button presses, to reach beyond the title screen
#   E) a deliberately incomplete --screenshot call, to make it print its usage
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Replace the template's Yoshi-specific config
        run: |
          cd game
          echo "---- format of the template's cyc_seeds.txt (first 8 lines) ----"
          head -n 8 cyc_seeds.txt || true
          printf '# empty config: first boot test for an AxROM game\n' > game.toml
          # Yoshi's code-seed addresses are wrong for this ROM: keep the file, empty it.
          : > cyc_seeds.txt
          rm -rf generated

      - name: Build the game runner
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 20 build_full.log
          exit $STATUS

      - name: Discovery runs (headless)
        continue-on-error: true
        run: |
          cd game/build
          EXE=$(realpath YoshiRecomp)
          export SDL_AUDIODRIVER=dummy

          echo "==== C: 3600 frames (about 1 minute of game time), miss log on ===="
          timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames.hash --miss-log miss.log > runC.log 2>&1 \
            || echo "C exited with status $?"
          tail -n 15 runC.log
          echo "---- miss.log: size and first 15 lines ----"
          wc -l miss.log 2>/dev/null || echo "no miss.log"
          head -n 15 miss.log 2>/dev/null || true
          echo "---- last frames.hash line ----"
          tail -n 1 frames.hash 2>/dev/null || true

          echo "==== D: random button presses to reach more of the game ===="
          timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 --spam --spam-seed 1 \
            --miss-log miss_spam.log > runD.log 2>&1 \
            || echo "D exited with status $?"
          tail -n 15 runD.log
          echo "---- miss_spam.log: size and first 15 lines ----"
          wc -l miss_spam.log 2>/dev/null || echo "no miss_spam.log"
          head -n 15 miss_spam.log 2>/dev/null || true

          echo "==== E: what does --screenshot expect? (expected to print usage) ===="
          timeout 30 "$EXE" "$ROM_PATH" --headless --frames 5 --screenshot \
            > runE.log 2>&1 || echo "E exited with status $?"
          tail -n 8 runE.log

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

      # No upload-artifact step: generated C, binaries and screenshots are
      # derived from the ROM. Next: feed the miss log into cyc_seeds.txt,
      # rebuild, and watch the native share of execution rise from 0.2%.
