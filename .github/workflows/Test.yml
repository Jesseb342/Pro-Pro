# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp: boot test, launcher skipped.
#
# State so far: the template (YoshiNESRecomp) builds against this ROM and the
# game binary launches, but it sat in the pre-boot launcher menu. This run
# tries two ways past that:
#   A) windowed mode under a virtual display with SkipLauncher = 1 in config.ini
#   B) the binary's own --headless / --frames / --hash-out flags
# The flag syntax in B is guessed from strings inside the binary, so B may print
# a usage error. Either way the log tells us the right syntax.
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Replace the template's Yoshi-specific config
        run: |
          cd game
          printf '# empty config: first boot test for an AxROM game\n' > game.toml
          # Yoshi's code-seed addresses are wrong for this ROM: keep the file, empty it.
          : > cyc_seeds.txt
          rm -rf generated

      - name: Build the game runner
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 20 build_full.log
          exit $STATUS

      - name: Boot test with the launcher skipped
        continue-on-error: true
        run: |
          cd game/build
          EXE=$(realpath YoshiRecomp)
          echo "---- every command-line flag found inside the binary ----"
          strings -a "$EXE" | grep -E '^--[a-z][a-z0-9-]+' | sort -u | head -n 200 || true

          echo "==== Attempt A: windowed under a virtual display, launcher skipped ===="
          printf '[Launcher]\nSkipLauncher = 1\n' > config.ini
          timeout 30 xvfb-run -a env SDL_AUDIODRIVER=dummy "$EXE" "$ROM_PATH" \
            > runA.log 2>&1 || echo "A exited with status $? (124 = ran until the 30 s timeout)"
          echo "---- A: last 40 lines ----"
          tail -n 40 runA.log

          echo "==== Attempt B: built-in headless flags (syntax guessed) ===="
          timeout 60 env SDL_AUDIODRIVER=dummy "$EXE" --headless --frames 600 \
            --hash-out frames.hash "$ROM_PATH" \
            > runB.log 2>&1 || echo "B exited with status $?"
          echo "---- B: last 40 lines ----"
          tail -n 40 runB.log

          echo "---- new files next to the executable ----"
          ls -la
          echo "---- frames.hash (first 10 lines) ----"
          head -n 10 frames.hash 2>/dev/null || echo "none"
          echo "---- dispatch_misses.log (first 40 lines) ----"
          head -n 40 dispatch_misses.log 2>/dev/null || echo "none"
          echo "---- fallback_telemetry.jsonl (last 5 lines) ----"
          tail -n 5 fallback_telemetry.jsonl 2>/dev/null || echo "none"

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

      # No upload-artifact step: generated C, binaries and screenshots are
      # derived from the ROM. Later: frame capture, game.toml entries from
      # dispatch_misses.log, and the iOS wrapper on a macOS runner.
