# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp: boot test.
#
# Goal of this run: build a runner around the generated code using an existing
# public NESRecomp game repo (YoshiNESRecomp, MMC1) as a TEMPLATE, then run the
# result headless for 45 seconds and print what happened.
#
# EXPECT FAILURES. The template is written for another game, so each run will
# probably stop at the next mismatch. The log is the point: paste the failing
# step's output back and we fix that one thing. The template files are printed
# on purpose so the next version can be written against the real layout.
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          echo "---- template layout ----"
          ls -la
          echo "---- setup.sh (first 80 lines) ----"
          head -n 80 setup.sh
          echo "---- CMakeLists.txt (first 150 lines) ----"
          head -n 150 CMakeLists.txt
          echo "---- framework commit ----"
          git -C nesrecomp log -1 --format='%H (%cd)' || true

      - name: Replace the template's game config with an empty one
        run: |
          cd game
          printf '# empty config: first boot test for an AxROM game\n' > game.toml
          # The template ships Yoshi's code-seed addresses; they are wrong for
          # this ROM, so leave the file present but empty.
          : > cyc_seeds.txt
          rm -rf generated

      - name: Build the recompiler
        run: |
          cd game
          cmake -S nesrecomp/recompiler -B nesrecomp/build/recompiler \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build nesrecomp/build/recompiler

      - name: Generate C from the ROM
        run: |
          cd game
          nesrecomp/build/recompiler/NESRecomp "$ROM_PATH" --game game.toml
          ls generated | head -n 40

      - name: Build the game runner
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          echo "---- error lines ----"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          echo "---- last 40 lines of build output ----"
          tail -n 40 build_full.log
          echo "---- nested build logs ----"
          for f in $(find build -mindepth 2 -maxdepth 3 \( -name '*.log' -o -name '*.err' \) ! -path '*CMakeFiles*'); do
            echo "== $f"
            tail -n 40 "$f"
          done
          exit $STATUS

      - name: Run headless for 45 seconds
        continue-on-error: true
        run: |
          cd game
          echo "---- build/ top level ----"
          ls -la build
          echo "---- all executables under build/ ----"
          find build -type f -perm -u+x ! -path '*CMakeFiles*' \
            ! -name '*.so*' ! -name '*.a' | sort
          # The template's CMake builds a host recompiler in build/nesrecomp-host;
          # that is a build tool, not the game, so skip it.
          EXE=$(find build -type f -perm -u+x ! -path '*CMakeFiles*' \
                ! -path '*nesrecomp-host*' ! -name '*.so*' ! -name '*.a' | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No game executable found: the game target may not have built."
            exit 1
          fi
          echo "game executable: $EXE"
          EXE=$(realpath "$EXE")
          cd "$(dirname "$EXE")"
          timeout 45 xvfb-run -a env SDL_AUDIODRIVER=dummy "$EXE" "$ROM_PATH" \
            > run.log 2>&1 || echo "exited with status $? (124 = hit the 45 s timeout, which is fine)"
          echo "---- last 60 lines of run.log ----"
          tail -n 60 run.log
          echo "---- files next to the executable ----"
          ls -la
          echo "---- dispatch_misses.log (first 40 lines) ----"
          head -n 40 dispatch_misses.log 2>/dev/null || echo "none"
          echo "---- fallback_telemetry.jsonl (last 5 lines) ----"
          tail -n 5 fallback_telemetry.jsonl 2>/dev/null || echo "none"
          echo "---- config.ini ----"
          cat config.ini 2>/dev/null || echo "none"
          echo "---- --help output ----"
          timeout 10 xvfb-run -a env SDL_AUDIODRIVER=dummy "$EXE" --help 2>&1 | head -n 60 || true
          echo "---- command-line flags found inside the binary ----"
          strings -a "$EXE" | grep -E '^--[a-z][a-z0-9-]+' | sort -u | head -n 60 || true
          echo "---- launcher/option lines in the CMake files ----"
          cd ..
          grep -n -i -E 'option\(|launcher|headless|no[-_]?ui' CMakeLists.txt \
            nesrecomp/runner/cyc/*.cmake 2>/dev/null | head -n 60 || true

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

      # No upload-artifact step: generated C, binaries and screenshots are
      # derived from the ROM. Later: frame capture, game.toml entries from
      # dispatch_misses.log, and the iOS wrapper on a macOS runner.
