# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp on the NESRecomp cycle backend.
#
# PROVEN so far (previous run): build the template against this ROM, run the
# game headless, turn the interpreter miss log into cyc_seeds.txt, rebuild, and
# the rerun executed 100% natively with all 3600 frame hashes IDENTICAL to the
# interpreter run. Coverage is only what the game did on its own in 3600
# frames (about 3,000 instructions, apparently an idle title loop).
#
# This run, by default, only READS the framework source to learn how scripted
# button input (--input / --virtual-pad) and frame dumps (--shot-every /
# --present-out) work, so we can reach the rest of the game. No ROM is
# downloaded for that. Tick "run_seed_loop" when starting the workflow to
# repeat the full build + seed loop instead.
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:
    inputs:
      run_seed_loop:
        description: "Also fetch the ROM, build, and run the seed loop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Read the framework source for input and frame-dump syntax
        continue-on-error: true
        run: |
          cd game
          echo "==== docs mentioning the flags ===="
          grep -rn -i -B1 -A6 -E -e '--input|--virtual-pad|--present-out|--shot-every' \
            nesrecomp --include='*.md' 2>/dev/null | head -n 90 || true
          echo "==== where --input's file is read ===="
          grep -n 'input_file' nesrecomp/runner/cyc/cyc_host.c | head -n 20 || true
          grep -rn -B2 -A30 -e 'fopen(input_file' nesrecomp/runner/cyc | head -n 90 || true
          echo "==== how --shot-every is used ===="
          grep -n -B1 -A10 -e 'shot_every' nesrecomp/runner/cyc/cyc_host.c | sed -n '1,70p' || true
          echo "==== how --present-out is used ===="
          grep -n -B1 -A10 -e 'present_out' nesrecomp/runner/cyc/cyc_host.c | sed -n '1,70p' || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        if: ${{ inputs.run_seed_loop }}
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Replace the template's Yoshi-specific config
        if: ${{ inputs.run_seed_loop }}
        run: |
          cd game
          printf '# empty config: first boot test for an AxROM game\n' > game.toml
          # Yoshi's code-seed addresses are wrong for this ROM: keep the file, empty it.
          : > cyc_seeds.txt
          rm -rf generated

      - name: Build the game runner
        if: ${{ inputs.run_seed_loop }}
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 20 build_full.log
          exit $STATUS

      - name: Seed loop (baseline, seed file, rebuild, rerun, compare)
        if: ${{ inputs.run_seed_loop }}
        continue-on-error: true
        run: |
          cd game
          EXE=$(realpath build/YoshiRecomp)
          export SDL_AUDIODRIVER=dummy

          echo "==== 1) baseline run ===="
          (cd build && timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames_base.hash --miss-log miss.log > run1.log 2>&1) \
            || echo "baseline exited with status $?"
          tail -n 3 build/run1.log

          echo "==== 2) turn the miss log into cyc_seeds.txt ===="
          grep -v '^#' build/miss.log | awk '{print $1}' > cyc_seeds.txt
          wc -l cyc_seeds.txt

          echo "==== 3) rebuild with the seeds ===="
          set +e
          cmake --build build > build_seeded.log 2>&1
          S=$?
          set -e
          echo "rebuild exit status: $S"
          grep -n -i -E 'error|fatal' build_seeded.log | head -n 20 || true

          echo "==== 4) rerun with the seeded build ===="
          (cd build && timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames_seeded.hash --miss-log miss2.log > run2.log 2>&1) \
            || echo "seeded run exited with status $?"
          tail -n 3 build/run2.log

          echo "==== 5) does the seeded build behave identically? ===="
          if cmp -s build/frames_base.hash build/frames_seeded.hash; then
            echo "IDENTICAL: all 3600 frame hashes match"
          else
            echo "DIFFERENT: first differing lines:"
            diff build/frames_base.hash build/frames_seeded.hash | head -n 6
          fi

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

      # No upload-artifact step: generated C, binaries and screenshots are
      # derived from the ROM. Next: scripted button input, then commit the
      # growing seed file (addresses only) back to this repo so it persists.
