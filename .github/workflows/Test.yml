# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM, 256 KB PRG, CHR-RAM) recomp: framework probe.
#
# This run answers one question before we invest more: does upstream
# mstan/nesrecomp accept this ROM? Its README lists mapper 7 as "not yet"
# supported, so a failure here is informative, not a bug in this workflow.
#
# ROM_URL and ROM_SHA1 are hardcoded below. Keep this repo private: anyone who
# can read this file can read the Drive link.

name: rcproam2-recomp

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Clone upstream nesrecomp
        run: |
          git clone --depth 1 https://github.com/mstan/nesrecomp.git framework
          git -C framework log -1 --format='framework commit: %H (%cd)'

      - name: Build the recompiler
        run: |
          cmake -S framework/recompiler -B framework/build/recompiler \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build framework/build/recompiler

      - name: Probe - run the recompiler on the ROM (no game config)
        continue-on-error: true
        run: |
          # TODO: flags are unverified; the README says game.toml is optional.
          BIN=$(find framework/build/recompiler -maxdepth 3 -type f \
                -iname 'NESRecomp*' -perm -u+x | head -n 1)
          echo "recompiler binary: ${BIN:-NOT FOUND}"
          "$BIN" "$ROM_PATH" > probe.log 2>&1 || echo "recompiler exited with status $?"
          echo "---- last 60 lines of recompiler output ----"
          tail -n 60 probe.log
          echo "---- generated files ----"
          ls -la generated 2>/dev/null | head -n 30 || echo "no generated/ directory"

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" generated probe.log

      # No upload-artifact step: generated C and binaries are derived from the
      # ROM. Next steps once the probe passes: game.toml for AxROM bank
      # switching, the native runner build, headless frame checks, and an
      # iOS wrapper (SDL3/Metal Xcode project) on a macOS runner.
