# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp on the NESRecomp cycle backend.
#
# PROVEN so far:
#   - the template builds against this ROM and runs the game headless
#   - the seed loop (miss log -> cyc_seeds.txt -> rebuild) gives 100% native
#     execution with all 3600 frame hashes identical to the interpreter run
#   - screenshots show the real game with no graphical errors (title screen)
# KNOWN about --input files: one step per line, "FRAME [PORT:]BUTTONS", where
# "-" releases everything, "#" starts a comment, and the buttons stay held until
# the next step. The button NAMES come from parse_buttons(), which we print.
#
# Options when you tap "Run workflow":
#   run_seed_loop    fetch the ROM, build, and repeat the seed loop
#   save_screenshots fetch the ROM, build, and upload PNG frames (private, 1 day)
#   try_input        fetch the ROM, build, and try several button-name styles in
#                    a scripted input file; the one that makes the game touch
#                    MORE code than the no-input baseline is the right one
# With all unticked it only reads the framework source (parse_buttons).
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:
    inputs:
      run_seed_loop:
        description: "Fetch the ROM, build, and run the seed loop"
        type: boolean
        default: false
      save_screenshots:
        description: "Fetch the ROM, build, and upload PNG frames (private, 1 day)"
        type: boolean
        default: false
      try_input:
        description: "Fetch the ROM, build, and try scripted button input"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Read the framework source for the button names (parse_buttons)
        continue-on-error: true
        run: |
          cd game
          echo "==== parse_buttons ===="
          grep -n 'parse_buttons' nesrecomp/runner/cyc/cyc_host.c | head -n 10 || true
          grep -n -A45 -e 'parse_buttons(const char' nesrecomp/runner/cyc/cyc_host.c | head -n 90 || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        if: ${{ inputs.run_seed_loop || inputs.save_screenshots || inputs.try_input }}
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Replace the template's Yoshi-specific config
        if: ${{ inputs.run_seed_loop || inputs.save_screenshots || inputs.try_input }}
        run: |
          cd game
          printf '# empty config: first boot test for an AxROM game\n' > game.toml
          # Yoshi's code-seed addresses are wrong for this ROM: keep the file, empty it.
          : > cyc_seeds.txt
          rm -rf generated

      - name: Build the game runner
        if: ${{ inputs.run_seed_loop || inputs.save_screenshots || inputs.try_input }}
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 20 build_full.log
          exit $STATUS

      - name: Input format trials (headless)
        if: ${{ inputs.try_input }}
        continue-on-error: true
        run: |
          cd game/build
          export SDL_AUDIODRIVER=dummy

          echo "==== baseline: no input, 1600 frames ===="
          timeout 150 ./YoshiRecomp "$ROM_PATH" --headless --frames 1600 \
            --miss-log miss_base.log --hash-out hash_base.txt > run_base.log 2>&1 \
            || echo "baseline exited with status $?"
          N=$(grep -c -v '^#' miss_base.log 2>/dev/null || true)
          echo "RESULT baseline: distinct interpreted addresses: ${N:-0}"

          # Each case taps a "start" button then an "A" button every 60 frames
          # from frame 120 (release with "-"), using a different naming style.
          run_case () {
            name=$1; tok=$2; tok2=$3
            : > "in_$name.txt"
            for f in $(seq 120 60 1500); do
              echo "$f $tok" >> "in_$name.txt"
              echo "$((f + 6)) -" >> "in_$name.txt"
              echo "$((f + 30)) $tok2" >> "in_$name.txt"
              echo "$((f + 36)) -" >> "in_$name.txt"
            done
            timeout 150 ./YoshiRecomp "$ROM_PATH" --headless --frames 1600 \
              --input "in_$name.txt" --miss-log "miss_$name.log" \
              --hash-out "hash_$name.txt" > "run_$name.log" 2>&1 \
              || echo "$name exited with status $?"
            n=$(grep -c -v '^#' "miss_$name.log" 2>/dev/null || true)
            same="differ from baseline"
            if cmp -s hash_base.txt "hash_$name.txt"; then
              same="IDENTICAL to baseline (input had no effect)"
            fi
            echo "RESULT $name ($tok / $tok2): $(grep -m1 '^input:' "run_$name.log" || echo 'no input line') | distinct interpreted addresses: ${n:-0} | frame hashes $same"
          }

          echo "==== trials ===="
          run_case words START A
          run_case letters T A
          run_case lower start a
          run_case mixed Start A

          echo "==== last 5 lines of the first trial's log ===="
          tail -n 5 run_words.log

      - name: Seed loop (baseline, seed file, rebuild, rerun, compare)
        if: ${{ inputs.run_seed_loop }}
        continue-on-error: true
        run: |
          cd game
          EXE=$(realpath build/YoshiRecomp)
          export SDL_AUDIODRIVER=dummy

          echo "==== 1) baseline run ===="
          (cd build && timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames_base.hash --miss-log miss.log > run1.log 2>&1) \
            || echo "baseline exited with status $?"
          tail -n 3 build/run1.log

          echo "==== 2) turn the miss log into cyc_seeds.txt ===="
          grep -v '^#' build/miss.log | awk '{print $1}' > cyc_seeds.txt
          wc -l cyc_seeds.txt

          echo "==== 3) rebuild with the seeds ===="
          set +e
          cmake --build build > build_seeded.log 2>&1
          S=$?
          set -e
          echo "rebuild exit status: $S"
          grep -n -i -E 'error|fatal' build_seeded.log | head -n 20 || true

          echo "==== 4) rerun with the seeded build ===="
          (cd build && timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames_seeded.hash --miss-log miss2.log > run2.log 2>&1) \
            || echo "seeded run exited with status $?"
          tail -n 3 build/run2.log

          echo "==== 5) does the seeded build behave identically? ===="
          if cmp -s build/frames_base.hash build/frames_seeded.hash; then
            echo "IDENTICAL: all 3600 frame hashes match"
          else
            echo "DIFFERENT: first differing lines:"
            diff build/frames_base.hash build/frames_seeded.hash | head -n 6
          fi

      - name: Capture screenshots (headless)
        if: ${{ inputs.save_screenshots }}
        continue-on-error: true
        run: |
          cd game/build
          mkdir -p shots
          export SDL_AUDIODRIVER=dummy
          # --shot-every N writes a numbered 256x240 PNG every N frames.
          timeout 150 ./YoshiRecomp "$ROM_PATH" --headless --frames 3600 \
            --screenshot shots/frame.png --shot-every 600 > shots.log 2>&1 \
            || echo "exited with status $?"
          tail -n 5 shots.log
          ls -la shots

      - name: Upload screenshots (private artifact, kept 1 day)
        if: ${{ inputs.save_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: game/build/shots/*.png
          retention-days: 1
          if-no-files-found: warn

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

      # Next: once the right button names are known, write a real route (title,
      # menu, a race) as an --input file, run the seed loop with it, and commit
      # the growing seed file (addresses only) back to this repo.
