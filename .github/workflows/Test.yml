# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp on the NESRecomp cycle backend.
#
# PROVEN so far:
#   - the template builds against this ROM and runs the game headless
#   - seed loop: miss log -> cyc_seeds.txt -> rebuild gives 100% native
#     execution with frame hashes identical to the interpreter run
#   - screenshots show the real game with no graphical errors (title screen)
#   - scripted input works: button names are words, case-insensitive. START and
#     A are accepted ("T" is not). One scripted run touched 8,055 code addresses
#     in 1,600 frames versus 1,372 with no input.
#
# Options when you tap "Run workflow":
#   run_seed_loop     fetch the ROM, build, run the seed loop (no input script)
#   try_input         fetch the ROM, build, run a scripted route of 5,400 frames
#                     (menu taps, then drive with A and steer LEFT/RIGHT) and
#                     report how much of the game it reached
#   save_screenshots  with try_input: also upload PNG frames of the route as a
#                     PRIVATE artifact kept 1 day (game screens: keep the repo
#                     private and delete the artifact afterwards)
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:
    inputs:
      run_seed_loop:
        description: "Fetch the ROM, build, and run the seed loop"
        type: boolean
        default: false
      try_input:
        description: "Fetch the ROM, build, and run the scripted route"
        type: boolean
        default: false
      save_screenshots:
        description: "With the route: upload PNG frames (private, 1 day)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        if: ${{ inputs.run_seed_loop || inputs.try_input }}
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Replace the template's Yoshi-specific config
        if: ${{ inputs.run_seed_loop || inputs.try_input }}
        run: |
          cd game
          printf '# empty config: first boot test for an AxROM game\n' > game.toml
          # Yoshi's code-seed addresses are wrong for this ROM: keep the file, empty it.
          : > cyc_seeds.txt
          rm -rf generated

      - name: Build the game runner
        if: ${{ inputs.run_seed_loop || inputs.try_input }}
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 20 build_full.log
          exit $STATUS

      - name: Scripted route run (headless)
        if: ${{ inputs.try_input }}
        continue-on-error: true
        run: |
          cd game

          echo "==== button-name parser (searched across the runner source) ===="
          grep -rn 'parse_buttons' nesrecomp/runner --include='*.c' --include='*.h' | head -n 10 || true
          grep -rn -A45 -E '(uint8_t|unsigned( char)?|int) +parse_buttons *\(' \
            nesrecomp/runner --include='*.c' --include='*.h' | head -n 90 || true

          cd build
          export SDL_AUDIODRIVER=dummy
          mkdir -p shots

          # Route: tap START / A alternately through the menus (11 taps, one per
          # 60 frames from frame 120), then drive: hold A, nudge LEFT then RIGHT,
          # until about frame 5300. A button stays held until the next step, and
          # a step with only "-" releases everything. Names that the game does not
          # recognize are ignored by the parser, which just releases the buttons.
          : > route1.txt
          t=120
          for i in $(seq 1 11); do
            if [ $((i % 2)) -eq 1 ]; then b=START; else b=A; fi
            echo "$t $b" >> route1.txt
            echo "$((t + 6)) -" >> route1.txt
            t=$((t + 60))
          done
          while [ "$t" -lt 5300 ]; do
            echo "$t A" >> route1.txt;     t=$((t + 90))
            echo "$t LEFT" >> route1.txt;  t=$((t + 15))
            echo "$t A" >> route1.txt;     t=$((t + 90))
            echo "$t RIGHT" >> route1.txt; t=$((t + 15))
          done
          echo "$t -" >> route1.txt
          echo "---- first 12 lines of the route ----"
          head -n 12 route1.txt

          echo "==== run: 5400 frames with the route ===="
          timeout 240 ./YoshiRecomp "$ROM_PATH" --headless --frames 5400 \
            --input route1.txt --miss-log miss_route1.log \
            --hash-out hash_route1.txt \
            --screenshot shots/route.png --shot-every 450 > run_route1.log 2>&1 \
            || echo "route run exited with status $?"
          tail -n 6 run_route1.log
          N=$(grep -c -v '^#' miss_route1.log 2>/dev/null || true)
          echo "RESULT route1: distinct interpreted addresses: ${N:-0} (no input, 3600 frames: 1,720; trial with START/A taps, 1600 frames: 8,055)"
          ls shots | head -n 20

      - name: Upload route screenshots (private artifact, kept 1 day)
        if: ${{ inputs.try_input && inputs.save_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: route-screenshots
          path: game/build/shots/*.png
          retention-days: 1
          if-no-files-found: warn

      - name: Seed loop (baseline, seed file, rebuild, rerun, compare)
        if: ${{ inputs.run_seed_loop }}
        continue-on-error: true
        run: |
          cd game
          EXE=$(realpath build/YoshiRecomp)
          export SDL_AUDIODRIVER=dummy

          echo "==== 1) baseline run ===="
          (cd build && timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames_base.hash --miss-log miss.log > run1.log 2>&1) \
            || echo "baseline exited with status $?"
          tail -n 3 build/run1.log

          echo "==== 2) turn the miss log into cyc_seeds.txt ===="
          grep -v '^#' build/miss.log | awk '{print $1}' > cyc_seeds.txt
          wc -l cyc_seeds.txt

          echo "==== 3) rebuild with the seeds ===="
          set +e
          cmake --build build > build_seeded.log 2>&1
          S=$?
          set -e
          echo "rebuild exit status: $S"
          grep -n -i -E 'error|fatal' build_seeded.log | head -n 20 || true

          echo "==== 4) rerun with the seeded build ===="
          (cd build && timeout 150 "$EXE" "$ROM_PATH" --headless --frames 3600 \
            --hash-out frames_seeded.hash --miss-log miss2.log > run2.log 2>&1) \
            || echo "seeded run exited with status $?"
          tail -n 3 build/run2.log

          echo "==== 5) does the seeded build behave identically? ===="
          if cmp -s build/frames_base.hash build/frames_seeded.hash; then
            echo "IDENTICAL: all 3600 frame hashes match"
          else
            echo "DIFFERENT: first differing lines:"
            diff build/frames_base.hash build/frames_seeded.hash | head -n 6
          fi

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

      # Next: run the seed loop WITH the route (so the seed file covers menus and
      # racing, not just the title screen), verify identical hashes, then commit
      # the seed file (addresses only) back to this repo so progress persists.
