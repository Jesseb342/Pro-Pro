# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp on the NESRecomp cycle backend.
#
# PROVEN so far (Linux runner):
#   - the template builds against this ROM and runs the game headless
#   - screenshots show the real game with no graphical errors; cars drive
#   - random-input exploration seeded 13,000+ compiled instructions; the
#     seeded native build's frame hashes were IDENTICAL to an --interp-only run
#     on 3 unseen scripts, with 99.99%+ of cycles native
#   - coverage plateaued: run 2 found only 35 new addresses
#   Caveat: that proves coverage of what random play reaches, not the whole game.
#
# Controls: UP/DOWN/LEFT/RIGHT steer; A or B is gas. Names combine with "+".
#
# GOAL: an iOS app with 1x-4x display scaling. NES output is 256x240, so "4x"
# means crisp integer pixel scaling (up to 1024x960), plus Auto and framing
# options. The N64 projects this is modeled on (BananaPad, PaperPad) get their
# 1x-4x INTERNAL resolution from the RT64 3D renderer, which a 2D NES game has
# no equivalent of; real extra detail would need HD texture packs.
#
# Options when you tap "Run workflow":
#   explore          Linux: build, explore with random input, seed, verify
#   scripts, frames  size of the exploration
#   save_screenshots upload a few PNG frames (private, 1 day)
#   commit_seeds     commit seeds/cyc_seeds.txt (addresses only) to this repo
#   macos_verify     macOS (Apple Silicon): build the same game from the saved
#                    seeds and run the same 3 unseen scripts. The printed
#                    "HASHSUM" lines should match the Linux ones exactly.
#                    macOS minutes cost a multiple of Linux minutes: check your plan.
#                    RESULT SO FAR: it builds (after downgrading one AppleClang
#                    error) and total cycle counts equal Linux's on all 3
#                    scripts; native vs interp-only is IDENTICAL on macOS.
#   ios_probe        macOS: two cross-compile probes for the iOS Simulator
#                    (arm64): A = headless core only, B = windowed core with
#                    SDL2 built for iOS and the launcher UI switched off.
#                    These are expected to need fixes; the logs say which.
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:
    inputs:
      explore:
        description: "Linux: fetch the ROM, build, explore with random input, seed, verify"
        type: boolean
        default: false
      scripts:
        description: "How many random scripts to run for exploration"
        type: string
        default: "12"
      frames:
        description: "Frames per exploration script (60 frames = 1 second)"
        type: string
        default: "6000"
      save_screenshots:
        description: "Upload a few PNG frames from the Linux verification runs (private, 1 day)"
        type: boolean
        default: false
      commit_seeds:
        description: "Commit seeds/cyc_seeds.txt (addresses only) back to this repo"
        type: boolean
        default: false
      macos_verify:
        description: "macOS: build from the saved seeds and verify the same unseen scripts"
        type: boolean
        default: false
      ios_probe:
        description: "macOS: try cross-compiling the core for the iOS Simulator (two probes)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Random input-script generator, shared by the Linux and macOS jobs so both
  # produce byte-identical scripts for the same seed.
  GEN_ROUTE_PY: |
    import random, sys
    seed, out, frames = int(sys.argv[1]), sys.argv[2], int(sys.argv[3])
    rng = random.Random(seed)
    profile = seed % 3   # 0 mashing, 1 steady driving, 2 menu-heavy
    # Controls: UP/DOWN/LEFT/RIGHT steer; A or B is gas (we do not know
    # which), so most steps hold a gas button together with a direction.
    choices = [("A+LEFT", 10), ("A+RIGHT", 10), ("A", 8),
               ("B+LEFT", 10), ("B+RIGHT", 10), ("B", 8),
               ("A+B", 4), ("A+B+LEFT", 3), ("A+B+RIGHT", 3),
               ("A+UP", 2), ("A+DOWN", 2), ("B+UP", 2), ("B+DOWN", 2),
               ("LEFT", 3), ("RIGHT", 3), ("UP", 2), ("DOWN", 2),
               ("START", 2), ("SELECT", 1), ("-", 5)]
    names = [c for c, w in choices for _ in range(w)]
    lines = []
    t = 100
    while t < 900:                       # menu phase: tap START / A
        lines.append(f"{t} {rng.choice(['START', 'A'])}")
        lines.append(f"{t + 6} -")
        t += rng.randint(40, 90)
    while t < frames - 60:
        if profile == 0:                 # random button mashing
            lines.append(f"{t} {rng.choice(names)}")
            t += rng.randint(5, 45)
        elif profile == 1:               # steady driving
            gas = rng.choice(["A", "B"])
            steer = rng.choice(["", "+LEFT", "+RIGHT", "+LEFT", "+RIGHT"])
            lines.append(f"{t} {gas}{steer}")
            t += rng.randint(20, 120)
        else:                            # menu taps with driving bursts
            if rng.random() < 0.6:
                btn = rng.choice(["START", "A", "B", "UP", "DOWN", "SELECT"])
                lines.append(f"{t} {btn}")
                lines.append(f"{t + 6} -")
                t += rng.randint(30, 120)
            else:
                gas = rng.choice(["A", "B"])
                steer = rng.choice(["+LEFT", "+RIGHT", ""])
                lines.append(f"{t} {gas}{steer}")
                t += rng.randint(60, 200)
    with open(out, "w") as f:
        f.write("\n".join(lines) + "\n")

jobs:
  explore:
    if: ${{ inputs.explore }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Write access is only used by the optional "commit seeds" step, which
    # passes the token explicitly. Checkout does not persist it, so the
    # third-party build scripts below never see it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Prepare config and starting seeds
        run: |
          cd game
          printf '# empty config: AxROM game, seeds come from exploration\n' > game.toml
          rm -rf generated
          if [ -f "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" ]; then
            cp "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" cyc_seeds.txt
            echo "starting from $(wc -l < cyc_seeds.txt) saved seeds"
          else
            # Yoshi's seed addresses are wrong for this ROM: keep the file, empty.
            : > cyc_seeds.txt
            echo "no saved seeds yet: starting empty"
          fi

      - name: Build the game runner
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 10 build_full.log
          exit $STATUS

      - name: Explore with random input (accumulate the miss log)
        env:
          SCRIPTS: ${{ inputs.scripts }}
          FRAMES: ${{ inputs.frames }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd game/build
          export SDL_AUDIODRIVER=dummy
          case "$SCRIPTS" in ''|*[!0-9]*) SCRIPTS=12 ;; esac
          case "$FRAMES"  in ''|*[!0-9]*) FRAMES=6000 ;; esac
          printf '%s\n' "$GEN_ROUTE_PY" > gen_route.py
          rm -f miss_all.log
          for i in $(seq 1 "$SCRIPTS"); do
            s=$((RUN_NUMBER * 100 + i))
            python3 gen_route.py "$s" "route_$s.txt" "$FRAMES"
            timeout 600 ./YoshiRecomp "$ROM_PATH" --headless --frames "$FRAMES" \
              --input "route_$s.txt" --miss-log miss_all.log > "run_$s.log" 2>&1 \
              || echo "route $s exited with status $?"
            echo "after route $s (style $((s % 3))): $(grep -c -v '^#' miss_all.log 2>/dev/null) distinct addresses so far | $(grep -m1 '^mode=' "run_$s.log")"
          done

      - name: Merge the seeds and rebuild
        run: |
          cd game
          grep -v '^#' build/miss_all.log | awk '{print $1}' > new_seeds.txt
          echo "NEW this run: $(sort -u new_seeds.txt | wc -l) addresses the saved seeds did not cover"
          cat cyc_seeds.txt new_seeds.txt | grep -v '^#' | sort -u > merged.txt
          mv merged.txt cyc_seeds.txt
          echo "SEEDS: $(wc -l < cyc_seeds.txt) addresses in cyc_seeds.txt"
          set +e
          cmake --build build > build_seeded.log 2>&1
          S=$?
          set -e
          echo "rebuild exit status: $S"
          grep -n -i -E 'error|fatal' build_seeded.log | head -n 20 || true
          find build/cycle-YoshiRecomp -name codegen.log -exec grep -h 'instructions compiled' {} \; || true
          exit $S

      - name: Verify on unseen random scripts (native vs interpreter-only)
        run: |
          cd game/build
          export SDL_AUDIODRIVER=dummy
          mkdir -p shots
          # Fixed seeds far above any exploration seed; 900001-900003 cover all
          # three script styles.
          for s in 900001 900002 900003; do
            python3 gen_route.py "$s" "route_$s.txt" 6000
            timeout 300 ./YoshiRecomp "$ROM_PATH" --headless --frames 6000 \
              --input "route_$s.txt" --hash-out "hash_native_$s.txt" \
              --screenshot "shots/seed$s.png" --shot-every 1000 \
              > "run_native_$s.log" 2>&1 || echo "native $s exited with status $?"
            timeout 900 ./YoshiRecomp "$ROM_PATH" --headless --interp-only --frames 6000 \
              --input "route_$s.txt" --hash-out "hash_interp_$s.txt" \
              > "run_interp_$s.log" 2>&1 || echo "interp $s exited with status $?"
            if cmp -s "hash_native_$s.txt" "hash_interp_$s.txt"; then
              r=IDENTICAL
            else
              r=DIFFERENT
            fi
            echo "VERIFY unseen script $s (style $((s % 3))): frame hashes $r | $(grep -m1 '^mode=' "run_native_$s.log")"
            echo "HASHSUM linux $s: $(sha256sum "hash_native_$s.txt" | cut -d' ' -f1)"
          done

      - name: Upload screenshots (private artifact, kept 1 day)
        if: ${{ inputs.save_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: game/build/shots/*.png
          retention-days: 1
          if-no-files-found: warn

      - name: Commit the seed file back to this repo (addresses only)
        if: ${{ inputs.commit_seeds }}
        continue-on-error: true
        run: |
          mkdir -p seeds
          cp game/cyc_seeds.txt seeds/cyc_seeds.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seeds/cyc_seeds.txt
          git commit -m "Update code seeds ($(wc -l < seeds/cyc_seeds.txt) addresses)" \
            || { echo "nothing to commit"; exit 0; }
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ github.ref_name }}"

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

  macos:
    if: ${{ inputs.macos_verify }}
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: brew install ninja sdl2

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | shasum -a 1 -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Prepare config and the saved seeds
        run: |
          cd game
          printf '# empty config: AxROM game, seeds come from exploration\n' > game.toml
          rm -rf generated
          if [ -f "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" ]; then
            cp "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" cyc_seeds.txt
            echo "using $(wc -l < cyc_seeds.txt | tr -d ' ') saved seeds"
          else
            : > cyc_seeds.txt
            echo "NO saved seeds in the repo (seeds/cyc_seeds.txt): building unseeded"
          fi

      - name: Build the game runner (macOS arm64)
        run: |
          cd game
          # Same issue as Linux: the framework bundles Windows SDL2, so point
          # CMake at Homebrew's SDL2 instead.
          SDL2_DIR_BREW="$(brew --prefix sdl2)/lib/cmake/SDL2"
          echo "SDL2 config dir: $SDL2_DIR_BREW"
          ls "$SDL2_DIR_BREW" | head -n 5 || true
          # AppleClang makes "call to undeclared function" an ERROR; GCC on Linux
          # only warns. hw_fds.c (Famicom Disk System code, unused by this
          # cartridge game) calls cyc_trace_mix without a declaration, so
          # downgrade that diagnostic and show where the function is declared.
          echo "---- where cyc_trace_mix appears ----"
          grep -rn 'cyc_trace_mix' nesrecomp/runner --include='*.c' --include='*.h' | head -n 12 || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$SDL2_DIR_BREW" \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined' build_full.log | head -n 40 || true
          tail -n 10 build_full.log
          find build/cycle-YoshiRecomp -name codegen.log -exec grep -h 'instructions compiled' {} \; || true
          exit $STATUS

      - name: Verify on macOS (same unseen scripts as Linux)
        timeout-minutes: 35
        run: |
          cd game/build
          export SDL_AUDIODRIVER=dummy
          printf '%s\n' "$GEN_ROUTE_PY" > gen_route.py
          # macOS has no GNU timeout: the step's timeout-minutes limit applies.
          for s in 900001 900002 900003; do
            python3 gen_route.py "$s" "route_$s.txt" 6000
            ./YoshiRecomp "$ROM_PATH" --headless --frames 6000 \
              --input "route_$s.txt" --hash-out "hash_native_$s.txt" \
              > "run_native_$s.log" 2>&1 || echo "native $s exited with status $?"
            echo "HASHSUM macos $s: $(shasum -a 256 "hash_native_$s.txt" | cut -d' ' -f1) | $(grep -m1 '^mode=' "run_native_$s.log")"
          done
          # Interpreter-only check on one script (native vs interpreter, on macOS).
          ./YoshiRecomp "$ROM_PATH" --headless --interp-only --frames 6000 \
            --input route_900001.txt --hash-out hash_interp_900001.txt \
            > run_interp_900001.log 2>&1 || echo "interp exited with status $?"
          if cmp -s hash_native_900001.txt hash_interp_900001.txt; then
            echo "VERIFY macos 900001: native vs interp-only IDENTICAL"
          else
            echo "VERIFY macos 900001: native vs interp-only DIFFERENT"
          fi

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build

  ios-probe:
    if: ${{ inputs.ios_probe }}
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: brew install ninja

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | shasum -a 1 -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Prepare config and the saved seeds
        run: |
          cd game
          printf '# empty config: AxROM game, seeds come from exploration\n' > game.toml
          rm -rf generated
          if [ -f "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" ]; then
            cp "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" cyc_seeds.txt
            echo "using $(wc -l < cyc_seeds.txt | tr -d ' ') saved seeds"
          else
            : > cyc_seeds.txt
            echo "NO saved seeds in the repo (seeds/cyc_seeds.txt): building unseeded"
          fi

      - name: Probe A - headless core cross-compiled for the iOS Simulator
        continue-on-error: true
        run: |
          cd game
          set +e
          cmake -S . -B build-ios-a -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DNESRECOMP_HEADLESS=ON -DNESRECOMP_ROM="$ROM_PATH" \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" > cfg_a.log 2>&1
          C=$?
          echo "A configure exit status: $C"
          tail -n 15 cfg_a.log
          if [ "$C" -ne 0 ]; then exit "$C"; fi
          cmake --build build-ios-a > build_a.log 2>&1
          B=$?
          echo "A build exit status: $B"
          grep -n -i -E 'error|fatal|undefined' build_a.log | head -n 30
          tail -n 8 build_a.log
          echo "---- executables produced ----"
          find build-ios-a -maxdepth 2 -type f -perm -u+x ! -path '*CMakeFiles*' | head
          exit "$B"

      - name: Build SDL2 for the iOS Simulator (static)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch release-2.30.0 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl-build
          cmake --install sdl-build
          ls sdl-install/lib | head
          ls sdl-install/lib/cmake/SDL2 | head

      - name: Probe B - windowed core (SDL2, no launcher UI) for the iOS Simulator
        continue-on-error: true
        run: |
          cd game
          # The template calls the launcher's CMake helper unconditionally;
          # drop that line since the desktop launcher UI is switched off.
          sed -i '' '/recomp_target_launcher_ui/d' CMakeLists.txt
          set +e
          cmake -S . -B build-ios-b -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DNESRECOMP_RECOMP_UI=OFF -DNESRECOMP_ROM="$ROM_PATH" \
            -DSDL2_DIR="$GITHUB_WORKSPACE/sdl-install/lib/cmake/SDL2" \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" > cfg_b.log 2>&1
          C=$?
          echo "B configure exit status: $C"
          tail -n 15 cfg_b.log
          if [ "$C" -ne 0 ]; then exit "$C"; fi
          cmake --build build-ios-b > build_b.log 2>&1
          B=$?
          echo "B build exit status: $B"
          grep -n -i -E 'error|fatal|undefined' build_b.log | head -n 30
          tail -n 8 build_b.log
          echo "---- executables produced ----"
          find build-ios-b -maxdepth 2 -type f -perm -u+x ! -path '*CMakeFiles*' | head
          exit "$B"

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build-ios-a game/build-ios-b
