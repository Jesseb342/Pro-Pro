# .github/workflows/build.yml
# R.C. Pro-Am II (mapper 7 / AxROM) recomp on the NESRecomp cycle backend.
#
# PROVEN so far:
#   - the template builds against this ROM and runs the game headless
#   - seed loop: miss log -> cyc_seeds.txt -> rebuild gives 100% native
#     execution with frame hashes identical to the interpreter run
#   - screenshots show the real game with no graphical errors
#   - scripted input works. Button names: A B SELECT START UP DOWN LEFT RIGHT,
#     combined with "+" (for example A+RIGHT). Unknown names are ignored.
#   - a hand-written route reached the in-game screen but the car never left
#     the start line (it held A and steered, one button at a time), so this
#     version stops hand-driving blind.
#   - controls (from the player): UP/DOWN/LEFT/RIGHT steer, and A or B is gas,
#     so playing needs a gas button AND a direction pressed together.
#
# What "explore" does (tick it when you tap "Run workflow"):
#   1. build the game, starting from seeds/cyc_seeds.txt if this repo has one
#   2. run 10 RANDOM button-mashing scripts of 6000 frames; the framework's miss
#      log accumulates every ROM address the interpreter had to run
#   3. merge those into cyc_seeds.txt and rebuild (more code compiled natively)
#   4. verify on 3 DIFFERENT random scripts never used for seeding: the native
#      build's per-frame hashes must equal an --interp-only run's, and the
#      native share on unseen play shows how well the seeds generalize
# Optional: save_screenshots uploads a few PNG frames (private, 1 day);
#           commit_seeds pushes the seed file (addresses only) back to this repo
#           so the next run starts where this one stopped.
#
# Template repos use the PolyForm Noncommercial license: keep this noncommercial.
# ROM_URL and ROM_SHA1 are hardcoded. Keep this repo private.

name: rcproam2-recomp

on:
  workflow_dispatch:
    inputs:
      explore:
        description: "Fetch the ROM, build, explore with random input, seed, verify"
        type: boolean
        default: true
      save_screenshots:
        description: "Upload a few PNG frames from the verification runs (private, 1 day)"
        type: boolean
        default: false
      commit_seeds:
        description: "Commit seeds/cyc_seeds.txt (addresses only) back to this repo"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explore:
    if: ${{ inputs.explore }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Write access is only used by the optional "commit seeds" step, which
    # passes the token explicitly. Checkout does not persist it, so the
    # third-party build scripts below never see it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libsdl2-dev xvfb

      - name: Clone template game project and framework
        run: |
          git clone --depth 1 https://github.com/mstan/YoshiNESRecomp.git game
          cd game
          chmod +x setup.sh
          ./setup.sh
          git -C nesrecomp log -1 --format='framework commit: %H (%cd)' || true

      - name: Fetch ROM from Google Drive (kept on the runner only)
        env:
          ROM_URL: "https://drive.google.com/uc?export=download&id=13qlBFeeqRVl-sMBtlnH5PRf9poEicja5"
          ROM_SHA1: "d536d1a6d87fa2c9d32f58f76c9545cc506fea8f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom"
          F="$RUNNER_TEMP/rom/game.nes"
          curl -fsSL --retry 3 -o "$F" "$ROM_URL"
          head -c 4 "$F" | grep -q '^NES' \
            || { echo "Download is not an iNES file (bad link or Drive error)"; exit 1; }
          echo "$ROM_SHA1  $F" | sha1sum -c -
          echo "ROM_PATH=$F" >> "$GITHUB_ENV"

      - name: Prepare config and starting seeds
        run: |
          cd game
          printf '# empty config: AxROM game, seeds come from exploration\n' > game.toml
          rm -rf generated
          if [ -f "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" ]; then
            cp "$GITHUB_WORKSPACE/seeds/cyc_seeds.txt" cyc_seeds.txt
            echo "starting from $(wc -l < cyc_seeds.txt) saved seeds"
          else
            # Yoshi's seed addresses are wrong for this ROM: keep the file, empty.
            : > cyc_seeds.txt
            echo "no saved seeds yet: starting empty"
          fi

      - name: Build the game runner
        run: |
          cd game
          # The framework bundles Windows SDL2 headers (they need windows.h),
          # so point CMake at the Linux SDL2 installed by apt instead.
          SDL2_CFG=$(dpkg -L libsdl2-dev | grep 'sdl2-config\.cmake$' | head -n 1)
          echo "system SDL2 config: ${SDL2_CFG:-NOT FOUND}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNESRECOMP_ROM="$ROM_PATH" -DSDL2_DIR="$(dirname "$SDL2_CFG")"
          set +e
          cmake --build build > build_full.log 2>&1
          STATUS=$?
          set -e
          echo "build exit status: $STATUS"
          grep -n -i -E 'error|fatal|undefined reference|no such file' build_full.log | head -n 40 || true
          tail -n 10 build_full.log
          exit $STATUS

      - name: Explore with random input (accumulate the miss log)
        run: |
          cd game/build
          export SDL_AUDIODRIVER=dummy
          cat > gen_route.py <<'PY'
          import random, sys
          seed, out, frames = int(sys.argv[1]), sys.argv[2], int(sys.argv[3])
          rng = random.Random(seed)
          # Controls: UP/DOWN/LEFT/RIGHT steer; A or B is gas (we do not know
          # which), so most steps hold a gas button together with a direction.
          choices = [("A+LEFT", 10), ("A+RIGHT", 10), ("A", 8),
                     ("B+LEFT", 10), ("B+RIGHT", 10), ("B", 8),
                     ("A+B", 4), ("A+B+LEFT", 3), ("A+B+RIGHT", 3),
                     ("A+UP", 2), ("A+DOWN", 2), ("B+UP", 2), ("B+DOWN", 2),
                     ("LEFT", 3), ("RIGHT", 3), ("UP", 2), ("DOWN", 2),
                     ("START", 2), ("SELECT", 1), ("-", 5)]
          names = [c for c, w in choices for _ in range(w)]
          lines = []
          t = 100
          while t < 900:                       # menu phase: tap START / A
              lines.append(f"{t} {rng.choice(['START', 'A'])}")
              lines.append(f"{t + 6} -")
              t += rng.randint(40, 90)
          while t < frames - 60:               # play phase: random mashing
              lines.append(f"{t} {rng.choice(names)}")
              t += rng.randint(5, 45)
          with open(out, "w") as f:
              f.write("\n".join(lines) + "\n")
          PY
          rm -f miss_all.log
          for s in 101 102 103 104 105 106 107 108 109 110; do
            python3 gen_route.py "$s" "route_$s.txt" 6000
            timeout 300 ./YoshiRecomp "$ROM_PATH" --headless --frames 6000 \
              --input "route_$s.txt" --miss-log miss_all.log > "run_$s.log" 2>&1 \
              || echo "route $s exited with status $?"
            echo "after route $s: $(grep -c -v '^#' miss_all.log 2>/dev/null) distinct addresses so far | $(grep -m1 '^mode=' "run_$s.log")"
          done

      - name: Merge the seeds and rebuild
        run: |
          cd game
          grep -v '^#' build/miss_all.log | awk '{print $1}' > new_seeds.txt
          cat cyc_seeds.txt new_seeds.txt | grep -v '^#' | sort -u > merged.txt
          mv merged.txt cyc_seeds.txt
          echo "SEEDS: $(wc -l < cyc_seeds.txt) addresses in cyc_seeds.txt"
          set +e
          cmake --build build > build_seeded.log 2>&1
          S=$?
          set -e
          echo "rebuild exit status: $S"
          grep -n -i -E 'error|fatal' build_seeded.log | head -n 20 || true
          find build/cycle-YoshiRecomp -name codegen.log -exec grep -h 'instructions compiled' {} \; || true
          exit $S

      - name: Verify on unseen random scripts (native vs interpreter-only)
        run: |
          cd game/build
          export SDL_AUDIODRIVER=dummy
          mkdir -p shots
          for s in 901 902 903; do
            python3 gen_route.py "$s" "route_$s.txt" 6000
            timeout 300 ./YoshiRecomp "$ROM_PATH" --headless --frames 6000 \
              --input "route_$s.txt" --hash-out "hash_native_$s.txt" \
              --screenshot "shots/seed$s.png" --shot-every 1000 \
              > "run_native_$s.log" 2>&1 || echo "native $s exited with status $?"
            timeout 600 ./YoshiRecomp "$ROM_PATH" --headless --interp-only --frames 6000 \
              --input "route_$s.txt" --hash-out "hash_interp_$s.txt" \
              > "run_interp_$s.log" 2>&1 || echo "interp $s exited with status $?"
            if cmp -s "hash_native_$s.txt" "hash_interp_$s.txt"; then
              r=IDENTICAL
            else
              r=DIFFERENT
            fi
            echo "VERIFY unseen script $s: frame hashes $r | $(grep -m1 '^mode=' "run_native_$s.log")"
          done

      - name: Upload screenshots (private artifact, kept 1 day)
        if: ${{ inputs.save_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: game/build/shots/*.png
          retention-days: 1
          if-no-files-found: warn

      - name: Commit the seed file back to this repo (addresses only)
        if: ${{ inputs.commit_seeds }}
        continue-on-error: true
        run: |
          mkdir -p seeds
          cp game/cyc_seeds.txt seeds/cyc_seeds.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seeds/cyc_seeds.txt
          git commit -m "Update code seeds ($(wc -l < seeds/cyc_seeds.txt) addresses)" \
            || { echo "nothing to commit"; exit 0; }
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ github.ref_name }}"

      - name: Wipe ROM and generated code
        if: always()
        run: rm -rf "$RUNNER_TEMP/rom" game/generated game/build
